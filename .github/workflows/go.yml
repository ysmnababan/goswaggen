name: CI
on:
  push:
    branches:
      - main
      - staging
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install dependencies
        run: go get .

      # - name: Go Format
      #   run: gofmt -s -w . && git diff --exit-code

      - name: Test
        run: go test -coverpkg=./... -coverprofile=coverage.out ./...
      
      - name: Build
        run: go build -v ./...